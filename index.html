    <!-- OPEN GRAPH TAGS -->

<body>
    <header>
        <img src="images/logo.svg" alt="Site Logo" width="140" height="50">
        <button id="hamburger" class="hamburger" aria-label="Nav Link Button"></button>
    </header>
    <nav id="navbar">
        <ul>
            <li><a href="#">Candidates</a></li>
            <li><a href="#">Employers</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About Us</a></li>
            <li class="active"><a href="index.html">Apply</a></li>

        </ul>
    </nav>

    <main>
        <h1>Apply</h1>
        <form action="results.html" method="get">
            <label>First Name
                <input type="text" name="first" required autocomplete="given-name" placeholder="First name">
            </label>
            <label>Last Name
                <input type="text" name="last" required autocomplete="family-name" placeholder="Last name">
            </label>
            <label>
                <input type="tel" name="phone" required autocomplete="tel" placeholder="801-274-2875">
            </label>
            <label>email
                <input type="email" name="email" required autocomplete="email" placeholder="example@email.com">
            </label>
            <label>Portfolio URL
                <input type="url" name="url" required autocomplete="url" placeholder="https://website.com">
            </label>
            <label>Applying As
                <select name="who" required>
                    <option value="Master">Master Designer</option>
                    <option value="Apprentice">Apprentice Designer</option>
                    <option value="Student">Student Designer</option>
                    <option value="Employer">Employer</option>
                </select>
            </label>
            <label>Comments
                <textarea name="comments" rows="5" placeholder="Enter your message"></textarea>
            </label>
            <input type="submit" value="Apply Now">

        </form>

    </main>
    <footer>
        <div class="social">
            <a href="https://www.youtube.com/@savannahmoller5223" target="_blank"><img src="images/icon-youtube.svg"
                    alt="YouTube Icon" width="16" height="16"></a>
            <a href="https://github.com/savmoller7" target="_blank"><img src="images/icon-github.svg" alt="GitHub Icon"
                    width="16" height="16"></a>
            <a href="https://www.linkedin.com/in/savannah-moller-494623241/" target="_blank"><img
                    src="images/icon-linkedin.svg" alt="LinkedIn Icon" width="16" height="16"></a>
            <a href="https://www.facebook.com/savvym000/" target="_blank"><img src="images/icon-facebook.svg"
                    alt="Facebook Icon" width="16" height="16"></a>
        </div>
        <p>&copy; <span id="currentyear"></span> &bull; Savannah Moller &bull; DWDD1720</p>
    </footer>


</body>

</html>
